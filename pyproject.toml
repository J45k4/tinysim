[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysim"
version = "0.1.0"
description = "A small batched robotics simulator built on tinygrad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tinysim-verify = "tinysim.verify:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinysim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
